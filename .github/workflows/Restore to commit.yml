name: Reset File To Commit

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: "Commit hash to reset the file to"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch All Branches
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Find Commit, Branch and File
        id: info
        run: |
          HASH="${{ inputs.commit_hash }}"

          if ! git cat-file -e "$HASH^{commit}" 2>/dev/null; then
            echo "Commit not found: $HASH"
            exit 1
          fi

          HASH=$(git rev-parse "$HASH")
          SHORT=$(git rev-parse --short "$HASH")
          TITLE=$(git log -1 --format=%s "$HASH")

          echo "Commit: $HASH"
          echo "Title: $TITLE"

          # Find a remote branch containing this exact commit.
          BASE=$(git for-each-ref \
            --format='%(refname:strip=3)' \
            refs/remotes/origin/ \
            | while read BRANCH; do
                [ "$BRANCH" = "HEAD" ] && continue

                if git merge-base --is-ancestor "$HASH" "origin/$BRANCH" 2>/dev/null; then
                  echo "$BRANCH"
                  break
                fi
              done)

          if [ -z "$BASE" ]; then
            echo "No remote branch contains commit $HASH"
            exit 1
          fi

          # Get the file changed by this commit.
          FILES=$(git diff-tree --no-commit-id --name-only -r "$HASH")

          FILE_COUNT=$(echo "$FILES" | sed '/^$/d' | wc -l)

          if [ "$FILE_COUNT" -ne 1 ]; then
            echo "Expected exactly one file changed by the commit."
            echo
            echo "Files:"
            echo "$FILES"
            exit 1
          fi

          FILE=$(echo "$FILES" | head -n 1)

          echo "Base branch: $BASE"
          echo "File: $FILE"

          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Create Temporary Branch
        id: branch
        run: |
          BASE="${{ steps.info.outputs.base }}"
          SHORT="${{ steps.info.outputs.short }}"

          BRANCH="reset-${SHORT}-${GITHUB_RUN_ID}"

          git checkout -b "$BRANCH" "origin/$BASE"

          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Reset Only The File
        run: |
          HASH="${{ steps.info.outputs.hash }}"
          FILE="${{ steps.info.outputs.file }}"

          echo "Resetting:"
          echo "$FILE"

          echo "To exact version from:"
          git log -1 --oneline "$HASH"

          git restore --source="$HASH" -- "$FILE"

      - name: Commit
        run: |
          FILE="${{ steps.info.outputs.file }}"

          git add -- "$FILE"

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 1
          fi

          git commit \
            -m "Reset $FILE to ${{ steps.info.outputs.short }}"

      - name: Push
        run: |
          git push origin "${{ steps.branch.outputs.name }}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base "${{ steps.info.outputs.base }}" \
            --head "${{ steps.branch.outputs.name }}" \
            --title "Reset ${{ steps.info.outputs.file }} to ${{ steps.info.outputs.short }}" \
            --body "This PR resets only:

          \`${{ steps.info.outputs.file }}\`

          to the exact version stored in commit:

          \`${{ steps.info.outputs.hash }}\`

          Original commit:
          ${{ steps.info.outputs.title }}

          Base branch:
          \`${{ steps.info.outputs.base }}\`"