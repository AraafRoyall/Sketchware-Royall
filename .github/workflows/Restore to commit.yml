name: Restore File From Commit

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: "Commit hash to restore the edited file from"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch All Branches
        run: |
          git fetch origin "+refs/heads/*:refs/remotes/origin/*" --tags --prune

      - name: Find Commit
        id: commit
        run: |
          HASH="${{ inputs.commit_hash }}"

          if ! git cat-file -e "$HASH^{commit}" 2>/dev/null; then
            echo "Commit not found: $HASH"
            exit 1
          fi

          HASH=$(git rev-parse "$HASH")
          SHORT=$(git rev-parse --short "$HASH")
          TITLE=$(git log -1 --format=%s "$HASH")

          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Find Base Branch
        id: branch
        run: |
          HASH="${{ steps.commit.outputs.hash }}"

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          if git merge-base --is-ancestor "$HASH" "origin/$DEFAULT_BRANCH" 2>/dev/null; then
            BRANCH="$DEFAULT_BRANCH"
          else
            BRANCH=$(git for-each-ref \
              --format='%(refname:strip=3)' \
              refs/remotes/origin/ \
              | while read B; do
                  if [ "$B" != "HEAD" ] && \
                     git merge-base --is-ancestor "$HASH" "origin/$B" 2>/dev/null; then
                    echo "$B"
                    break
                  fi
                done)
          fi

          if [ -z "$BRANCH" ]; then
            echo "Could not find a branch containing commit $HASH"
            exit 1
          fi

          echo "Base branch: $BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Find Edited File
        id: file
        run: |
          HASH="${{ steps.commit.outputs.hash }}"

          FILES=$(git diff-tree --no-commit-id --name-only -r "$HASH")

          COUNT=$(echo "$FILES" | sed '/^$/d' | wc -l)

          if [ "$COUNT" -ne 1 ]; then
            echo "The commit does not edit exactly one file."
            echo
            echo "Files changed:"
            echo "$FILES"
            echo
            echo "This workflow requires a commit that changes exactly one file."
            exit 1
          fi

          FILE=$(echo "$FILES" | head -n 1)

          echo "File: $FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Create Restore Branch
        run: |
          git checkout -b "restore-${{ steps.commit.outputs.short }}" \
            "origin/${{ steps.branch.outputs.branch }}"

      - name: Restore File
        run: |
          HASH="${{ steps.commit.outputs.hash }}"
          FILE="${{ steps.file.outputs.file }}"

          git restore --source="$HASH^" -- "$FILE"

      - name: Commit Restore
        run: |
          FILE="${{ steps.file.outputs.file }}"

          git add -- "$FILE"

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 1
          fi

          git commit -m "Restore $FILE from before ${{ steps.commit.outputs.short }}"

      - name: Push Branch
        run: |
          git push origin "restore-${{ steps.commit.outputs.short }}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base "${{ steps.branch.outputs.branch }}" \
            --head "restore-${{ steps.commit.outputs.short }}" \
            --title "Revert: ${{ steps.commit.outputs.title }}" \
            --body "This PR restores the file changed by commit:

          \`${{ steps.file.outputs.file }}\`

          Commit:
          \`${{ steps.commit.outputs.hash }}\`

          Original commit:
          ${{ steps.commit.outputs.title }}

          Base branch:
          \`${{ steps.branch.outputs.branch }}\`

          Only the file changed by the selected commit is restored."