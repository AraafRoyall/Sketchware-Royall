name: Revert File From Commit

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: "Commit hash to revert"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  revert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch All Branches
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Find Commit, Branch and File
        id: info
        run: |
          HASH="${{ inputs.commit_hash }}"

          if ! git cat-file -e "$HASH^{commit}" 2>/dev/null; then
            echo "Commit not found: $HASH"
            exit 1
          fi

          HASH=$(git rev-parse "$HASH")
          SHORT=$(git rev-parse --short "$HASH")
          TITLE=$(git log -1 --format=%s "$HASH")

          DEFAULT="${{ github.event.repository.default_branch }}"

          # Prefer the default branch if it contains the commit.
          if git merge-base --is-ancestor "$HASH" "origin/$DEFAULT" 2>/dev/null; then
            BASE="$DEFAULT"
          else
            BASE=$(git for-each-ref \
              --format='%(refname:strip=3)' \
              refs/remotes/origin/ \
              | while read BRANCH; do
                  [ "$BRANCH" = "HEAD" ] && continue

                  if git merge-base --is-ancestor "$HASH" "origin/$BRANCH" 2>/dev/null; then
                    echo "$BRANCH"
                    break
                  fi
                done)
          fi

          if [ -z "$BASE" ]; then
            echo "Could not find a branch containing commit:"
            echo "$HASH"
            exit 1
          fi

          # Get files changed by the commit.
          FILES=$(git diff-tree --no-commit-id --name-only -r "$HASH")

          COUNT=$(echo "$FILES" | sed '/^$/d' | wc -l)

          if [ "$COUNT" -ne 1 ]; then
            echo "Expected exactly one changed file."
            echo
            echo "Commit: $HASH"
            echo "Files:"
            echo "$FILES"
            exit 1
          fi

          FILE=$(echo "$FILES" | head -n 1)

          echo "Commit : $HASH"
          echo "Title  : $TITLE"
          echo "Branch : $BASE"
          echo "File   : $FILE"

          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Create Unique Restore Branch
        id: branch
        run: |
          BASE="${{ steps.info.outputs.base }}"
          SHORT="${{ steps.info.outputs.short }}"

          BRANCH="restore-${SHORT}-${GITHUB_RUN_ID}"

          git checkout -b "$BRANCH" "origin/$BASE"

          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Restore Only Changed File
        run: |
          HASH="${{ steps.info.outputs.hash }}"
          FILE="${{ steps.info.outputs.file }}"

          echo "Restoring:"
          echo "$FILE"

          echo "From commit:"
          git log -1 --oneline "$HASH"

          echo "Restoring file to state before commit..."
          git restore --source="$HASH" -- "$FILE"

      - name: Commit Revert
        run: |
          FILE="${{ steps.info.outputs.file }}"

          git add -- "$FILE"

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 1
          fi

          git commit \
            -m "Revert: ${{ steps.info.outputs.title }}"

      - name: Push Restore Branch
        run: |
          git push origin "${{ steps.branch.outputs.name }}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base "${{ steps.info.outputs.base }}" \
            --head "${{ steps.branch.outputs.name }}" \
            --title "Revert: ${{ steps.info.outputs.title }}" \
            --body "This PR reverts the file changed by commit:

          \`${{ steps.info.outputs.hash }}\`

          File:
          \`${{ steps.info.outputs.file }}\`

          Original commit:
          ${{ steps.info.outputs.title }}

          Base branch:
          \`${{ steps.info.outputs.base }}\`

          Only the file changed by the selected commit is reverted."