name: Revert File From Commit

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: "Commit hash to revert"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  revert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch branches
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Find commit and branch
        id: info
        run: |
          HASH="${{ inputs.commit_hash }}"

          git cat-file -e "$HASH^{commit}"

          HASH=$(git rev-parse "$HASH")
          SHORT=$(git rev-parse --short "$HASH")
          TITLE=$(git log -1 --format=%s "$HASH")

          DEFAULT="${{ github.event.repository.default_branch }}"

          if git merge-base --is-ancestor "$HASH" "origin/$DEFAULT"; then
            BASE="$DEFAULT"
          else
            BASE=$(git for-each-ref \
              --format='%(refname:strip=3)' \
              refs/remotes/origin/ \
              | while read BRANCH; do
                  [ "$BRANCH" = "HEAD" ] && continue
                  if git merge-base --is-ancestor "$HASH" "origin/$BRANCH"; then
                    echo "$BRANCH"
                    break
                  fi
                done)
          fi

          if [ -z "$BASE" ]; then
            echo "Could not find branch containing $HASH"
            exit 1
          fi

          FILE=$(git diff-tree --no-commit-id --name-only -r "$HASH")

          if [ "$(echo "$FILE" | wc -l)" -ne 1 ]; then
            echo "Commit must change exactly one file."
            echo "$FILE"
            exit 1
          fi

          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Create fresh branch
        run: |
          BASE="${{ steps.info.outputs.base }}"
          SHORT="${{ steps.info.outputs.short }}"

          git checkout -B "restore-$SHORT" "origin/$BASE"

      - name: Restore file
        run: |
          HASH="${{ steps.info.outputs.hash }}"
          FILE="${{ steps.info.outputs.file }}"

          git restore --source="$HASH^" -- "$FILE"

      - name: Commit
        run: |
          FILE="${{ steps.info.outputs.file }}"

          git add -- "$FILE"

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 1
          fi

          git commit -m "Revert: ${{ steps.info.outputs.title }}"

      - name: Push
        run: |
          git push --force origin \
            "HEAD:restore-${{ steps.info.outputs.short }}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base "${{ steps.info.outputs.base }}" \
            --head "restore-${{ steps.info.outputs.short }}" \
            --title "Revert: ${{ steps.info.outputs.title }}" \
            --body "Reverts the file changed by:

          Commit: \`${{ steps.info.outputs.hash }}\`

          File: \`${{ steps.info.outputs.file }}\`

          Original commit:
          ${{ steps.info.outputs.title }}

          Base branch:
          \`${{ steps.info.outputs.base }}\`"